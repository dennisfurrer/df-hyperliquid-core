[package]
name = "hl-evm"
description = "HyperEVM and the Arbitrum side of the bridge: JSON-RPC, ABI, RLP and EIP-1559 transactions, the read precompiles, CoreWriter, and moving tokens between HyperCore and HyperEVM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
hl-core.workspace = true
serde.workspace = true
# raw_value: an answer's `result` is read as the text the node wrote, so a float in it never passes through an f64.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true

[features]
default = []
# The curve: a transaction signed with a key held in memory. Without it everything still builds the
# unsigned transaction, its signing hash and, given a signature from elsewhere, the raw bytes to send.
sign = ["hl-core/sign"]

[dev-dependencies]
hl-core = { workspace = true, features = ["sign"] }
# Itself with `sign`, so the tests cover the signing path; a normal build is unaffected.
hl-evm = { path = ".", features = ["sign"] }

[lints]
workspace = true
