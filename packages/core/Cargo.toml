[package]
name = "hl-core"
description = "Hyperliquid backbone: vocabulary, exact decimals, asset ids, the venue's shapes (books, prints, candles, mids, contexts, fills, orders, account state, ledger rows) read once, who may sign what, msgpack wire, L1 and user-signed signing, nonces, the info and exchange client behind a transport trait, rate-limit weights."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
# raw_value: a float the venue writes (a vault's `apr`) is read as its digits, never through an f64.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
keccak.workspace = true
k256 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

# k256 reaches getrandom 0.2 through rand_core's std feature; wasm32 needs its js backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { workspace = true, optional = true }

[features]
default = ["sign"]
# The curve: recovering and checking signatures, reading a wallet's, and a key held in memory.
# Without it everything still hashes and builds what would be signed; nothing can sign or check.
sign = ["dep:k256", "dep:zeroize", "dep:getrandom02"]

[lints]
workspace = true
