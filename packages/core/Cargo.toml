[package]
name = "df-hyperliquid-core"
description = "Hyperliquid SDK for Rust: markets, account, trading, transfers, earn and HIP-4 deploys, with exact decimals and signing. Native and wasm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/df-hyperliquid-core"
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
keccak.workspace = true
k256 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time", "macros", "net"] }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["CloseEvent", "Headers", "MessageEvent", "RequestInit", "Response", "WebSocket"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { workspace = true, optional = true }

[features]
default = ["sign", "native"]
# Signing and recovery. Without it, actions build and hash but nothing signs.
sign = ["dep:k256", "dep:zeroize", "dep:getrandom02"]
# HTTP and websocket for native programs (reqwest, tokio-tungstenite).
native = ["dep:reqwest", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
# HTTP and websocket for the browser and Workers (fetch, WebSocket).
web = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]
# The transports refuse whatever is signed: a post to `/exchange` and a raw HyperEVM transaction
# come back as `TransportError::Offline` before anything goes out. For a dependent's test build,
# as a dev-dependency feature, so no test can move money.
offline = []

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "market_order"
required-features = ["native"]

[[example]]
name = "signed_order"
required-features = ["native", "sign"]

[[example]]
name = "subscribe"
required-features = ["native"]

[[example]]
name = "outcome_trade"
required-features = ["native", "sign"]

[[example]]
name = "web_book"
required-features = ["web"]
