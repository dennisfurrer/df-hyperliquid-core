[package]
name = "hl-core"
description = "Hyperliquid backbone: vocabulary, exact decimals, asset ids, msgpack wire, L1 and user-signed signing, nonces, the info and exchange client behind a transport trait, rate-limit weights."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
# raw_value: a float the venue writes (a vault's `apr`) is read as its digits, never through an f64.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
k256.workspace = true
keccak.workspace = true
zeroize.workspace = true

# k256 reaches getrandom 0.2 through rand_core's std feature; wasm32 needs its js backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02.workspace = true

[lints]
workspace = true
