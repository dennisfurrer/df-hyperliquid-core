[package]
name = "hl-native"
description = "hl-core's wire for native programs: HTTP through reqwest and the websocket through tokio-tungstenite, both on rustls, and the system clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
hl-core.workspace = true
hl-ws.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
