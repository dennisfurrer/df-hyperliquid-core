# Benchmarks of hyperliquid-sdk-rs (github.com/lhermoso/hyperliquid-rust-sdk). Its own workspace
# and Cargo.lock: it depends on alloy 0.1, which cannot share a dependency graph with the alloy
# versions the other Rust SDKs use (both link the same C library, ckzg).
[package]
name = "bench-lhermoso"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "bench-lhermoso"
path = "src/main.rs"

[dependencies]
bench-common = { path = "../common" }
hyperliquid-sdk-rs = "=0.1.2"
# The versions and features hyperliquid-sdk-rs itself uses, for the types its API takes.
alloy = { version = "0.1", features = ["full"] }
rmp-serde = "1.1"
simd-json = "0.13"
# The SDK's examples install rustls's aws-lc-rs provider at start; without it, rustls cannot pick
# one of the two providers its dependency graph enables.
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "io-util"] }
futures = "0.3"

[workspace]

[profile.release]
debug = false

# `--profile release-lto` or `--profile both`: the same code with fat link-time optimization and
# one codegen unit, to show how much of a difference between rows code generation alone makes.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
