[package]
name = "bench-hypersdk"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "bench-hypersdk"
path = "src/main.rs"

[dependencies]
bench-common = { path = "../common" }
hypersdk = "=0.3.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "io-util"] }
futures = "0.3"
serde_json = "1"
log = "0.4"
