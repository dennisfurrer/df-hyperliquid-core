# Benchmarks of QuickNode's quicknode-hyperliquid-sdk. Its own workspace and Cargo.lock: its
# alloy 1.x cannot share a dependency graph with the alloy 0.1 of hyperliquid-sdk-rs (both link
# the same C library, ckzg).
[package]
name = "bench-quicknode"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "bench-quicknode"
path = "src/main.rs"

[dependencies]
bench-common = { path = "../common" }
quicknode-hyperliquid-sdk = "=0.1.9"
# The versions and features quicknode-hyperliquid-sdk itself uses, for the types its API takes.
alloy = { version = "1.0", features = ["full", "signer-local"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "io-util"] }
futures = "0.3"
hex = "0.4"

[workspace]

[profile.release]
debug = false

# `--profile release-lto` or `--profile both`: the same code with fat link-time optimization and
# one codegen unit, to show how much of a difference between rows code generation alone makes.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
