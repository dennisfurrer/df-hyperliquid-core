# Benchmarks of Hyperliquid's official Rust SDK, hyperliquid_rust_sdk. Its own workspace and
# Cargo.lock, like the other Rust competitors, so no SDK's dependency versions or features leak
# into another's build.
[package]
name = "bench-official-rust"
version = "0.0.0"
edition = "2021"  # the SDK's edition, which the copied proxy_digest.rs is written for
publish = false

[[bin]]
name = "bench-official-rust"
path = "src/main.rs"

[dependencies]
bench-common = { path = "../common" }
hyperliquid_rust_sdk = "=0.6.0"
# The versions and features hyperliquid_rust_sdk itself uses, for the types its API takes.
ethers = { version = "2.0.14", features = ["eip712", "abigen"] }
rmp-serde = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "io-util", "sync"] }
log = "0.4"

[workspace]

[profile.release]
debug = false

# `--profile release-lto` or `--profile both`: the same code with fat link-time optimization and
# one codegen unit, to show how much of a difference between rows code generation alone makes.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
