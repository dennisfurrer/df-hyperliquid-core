[package]
name = "bench-df"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "bench-df"
path = "src/main.rs"

[dependencies]
bench-common = { path = "../common" }
df-hyperliquid-core = { path = "../../packages/core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "io-util"] }
serde_json = "1"
getrandom = "0.3"
