name: Benchmark result
description: Share a `just bench-compare` run from your machine.
title: "Benchmark result: "
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for running the benchmark. Please run `just bench-compare` (not `--quick`) on an
        otherwise idle machine, on mains power and outside low power mode, then paste the JSON file it wrote to `bench/results/`.
        The file names the CPU, never the host or user.
  - type: input
    id: share
    attributes:
      label: Output of `just bench-share`
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Machine
      description: Laptop or desktop model, or cloud instance type with dedicated or shared vCPUs.
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: Results JSON
      description: The whole `bench/results/<date>-<hhmmss>-<cpu>.json` file.
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything that may have affected the figures, such as power mode or other load.
